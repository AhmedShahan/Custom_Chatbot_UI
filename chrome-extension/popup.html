<!DOCTYPE html>
<html>
<head>
  <title>RAG Chatbot Extension</title>
  <style>
    body {
      width: 250px;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    
    h2 {
      color: #333;
      font-size: 16px;
      margin-top: 0;
    }
    
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      font-weight: 500;
    }
    
    button:hover {
      background-color: #2563eb;
    }
    
    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <h2>RAG Chatbot Extension</h2>
  <p>Click the button below to toggle the chatbot bubble on the current page.</p>
  <button id="toggle-bubble">Toggle Chatbot Bubble</button>
  <script src="popup.js"></script>
</body>
</html>
